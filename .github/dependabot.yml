version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: 0 0 1 6,12 *
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: cron
      cronjob: 0 0 1 6,12 *
    groups:
      cargo:
        patterns: ["*"]
