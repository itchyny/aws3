name: CI

on:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:

permissions:
  contents: read

env:
  NAME: ${{ github.event.repository.name }}

defaults:
  run:
    shell: bash --noprofile --norc -euxo pipefail {0}

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.runs-on }}
    strategy:
      matrix:
        include:
          - os: linux-x64
            runs-on: ubuntu-24.04
            targets: x86_64-unknown-linux-gnu x86_64-unknown-linux-musl
          - os: linux-arm64
            runs-on: ubuntu-24.04-arm
            targets: aarch64-unknown-linux-gnu aarch64-unknown-linux-musl
          - os: darwin
            runs-on: macos-latest
            targets: x86_64-apple-darwin aarch64-apple-darwin
          - os: windows
            runs-on: windows-latest
            targets: x86_64-pc-windows-msvc aarch64-pc-windows-msvc
      fail-fast: false
    env:
      OS: ${{ matrix.os }}
      TARGETS: ${{ matrix.targets }}
      VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
      - name: Install target toolchains
        run: |
          read -ra targets <<< "$TARGETS"
          rustup target add "${targets[@]}"
      - name: Install musl tools on Linux
        if: startsWith(matrix.os, 'linux')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Build
        run: |
          read -ra targets <<< "$TARGETS"
          cargo build --locked --release "${targets[@]/#/--target=}"
      - name: Generate completions
        run: |
          read -ra targets <<< "$TARGETS"
          completion="target/${targets[0]}/release/$NAME completion"
          mkdir completions
          $completion zsh > "completions/_$NAME"
          $completion bash > "completions/$NAME.bash"
          $completion fish > "completions/$NAME.fish"
          $completion powershell > "completions/_$NAME.ps1"
          $completion elvish > "completions/$NAME.elv"
      - name: Build artifacts
        run: |
          read -ra targets <<< "$TARGETS"
          for target in "${targets[@]}"; do
            executable=target/$target/release/$NAME
            if [[ $OS != windows || $target == x86_64-* ]]; then
              "$executable" --version
            fi
            artifact=$NAME-$VERSION-$target
            mkdir "$artifact"
            cp -R README.md CHANGELOG.md LICENSE completions "$executable" "$artifact"
            7z a -tzip "$artifact.zip" "$artifact"
          done
      - name: Upload artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ env.NAME }}_${{ matrix.os }}
          path: '*.zip'
          if-no-files-found: error

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
      - name: Download artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          path: artifacts
          merge-multiple: true
      - name: Create checksums
        run: |
          cd artifacts
          sha256sum -- *.zip > "$NAME-$GITHUB_REF_NAME-checksums.txt"
      - name: Create release
        run: |
          sed -n '/\['"${GITHUB_REF_NAME//./[.]}"']/,/^$/{//!p;}' CHANGELOG.md |
            gh release create "$GITHUB_REF_NAME" --verify-tag \
              --title "Release $GITHUB_REF_NAME" --notes-file - artifacts/*
        env:
          GH_TOKEN: ${{ github.token }}

  publish:
    name: Publish
    needs: release
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1.0.6
      - name: Publish
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
