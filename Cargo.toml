[package]
name = "aws3"
version = "0.1.0"
edition = "2024"
description = "A fast command compatible with aws s3"
repository = "https://github.com/itchyny/aws3"
authors = ["itchyny <itchyny@cybozu.co.jp>"]
license = "MIT"
readme = "README.md"
keywords = ["aws", "s3", "cli"]
categories = ["command-line-utilities"]
rust-version = "1.94.1"

[dependencies]
aws-config = { version = "1.13.0", features = ["behavior-version-latest"] }
aws-credential-types = "1.3.1"
aws-sdk-s3 = "1.157.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.7", features = ["derive"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }

[profile.release]
lto = true
strip = true
codegen-units = 1
