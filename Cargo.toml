[package]
name = "aws3"
version = "0.1.0"
edition = "2024"
description = "A fast command compatible with aws s3"
repository = "https://github.com/itchyny/aws3"
authors = ["itchyny <itchyny@cybozu.co.jp>"]
license = "MIT"
readme = "README.md"
keywords = ["aws", "s3", "cli"]
categories = ["command-line-utilities"]
rust-version = "1.94.1"

[dependencies]
aws-config = { version = "1.13.0", default-features = false, features = ["behavior-version-latest", "credentials-process", "rt-tokio", "sso"] }
aws-credential-types = "1.3.1"
aws-sdk-s3 = { version = "1.157.0", default-features = false, features = ["http-1x", "rt-tokio", "sigv4a"] }
aws-smithy-http-client = { version = "1.5.2", features = ["rustls-aws-lc"] }
aws-smithy-types = "1.9.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.7", features = ["derive"] }
md-5 = "0.11.0"
rustls-pki-types = "1.15.1"
rustls-webpki = "0.103.16"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "fs", "io-std", "io-util", "sync"] }
webpki-root-certs = "1.0.11"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1

[dev-dependencies]
hyper-util = { version = "0.1.21", features = ["server-auto", "tokio"] }
s3s = "0.14.1"
s3s-fs = "0.14.1"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net"] }
