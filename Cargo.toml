[package]
name = "aws3"
version = "0.1.0"
edition = "2024"
description = "A fast command compatible with aws s3"
repository = "https://github.com/itchyny/aws3"
authors = ["itchyny <itchyny@cybozu.co.jp>"]
license = "MIT"
readme = "README.md"
keywords = ["aws", "s3", "cli"]
categories = ["command-line-utilities"]
rust-version = "1.94.1"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }{ archive-suffix }"
bin-dir = "{ name }-v{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "zip"

[dependencies]
aws-config = { version = "1.13.0", default-features = false, features = ["behavior-version-latest", "credentials-login", "credentials-process", "rt-tokio", "sso"] }
aws-credential-types = "1.3.1"
aws-runtime = "1.10.2"
aws-sdk-s3control = { version = "1.138.0", default-features = false, features = ["rt-tokio"] }
aws-sdk-sts = { version = "1.124.0", default-features = false, features = ["rt-tokio"] }
aws-sdk-s3 = { version = "1.157.0", default-features = false, features = ["http-1x", "rt-tokio", "sigv4a"] }
aws-sigv4 = { version = "1.6.4", default-features = false, features = ["sigv4a"] }
aws-smithy-checksums = "0.65.0"
aws-smithy-http-client = { version = "1.5.2", features = ["rustls-aws-lc"] }
aws-smithy-runtime-api = { version = "1.19.2", features = ["client", "http-1x"] }
aws-smithy-types = "1.9.1"
aws-types = "1.7.0"
bytes = "1.12.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.7", features = ["derive"] }
crc-fast = "1.10.0"
http = "1.5.0"
http-body = "1.1.0"
hyper-rustls = { version = "0.27.10", default-features = false, features = ["http1", "http2", "tls12"] }
hyper-util = { version = "0.1.21", features = ["client-legacy", "http1", "http2", "tokio"] }
md-5 = "0.11.0"
regex-lite = "0.1.9"
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rustls-pki-types = "1.15.1"
rustls-webpki = "0.103.16"
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "fs", "io-std", "io-util", "signal", "sync", "time"] }
webpki-root-certs = "1.0.11"

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1

[dev-dependencies]
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1.21", features = ["server-auto", "tokio"] }
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }
s3s = "0.14.1"
s3s-fs = "0.14.1"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "test-util"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs"] }
